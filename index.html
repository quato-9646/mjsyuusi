<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀収支計算アプリ (Firebase版)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .setting-item { display: flex; flex-direction: column; }
        label { font-size: 0.9em; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="number"], input[type="text"], input[type="password"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
        .players-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; background: #eef2f5; padding: 15px; border-radius: 8px; }
        .player-col { display: flex; flex-direction: column; gap: 8px; }
        .player-col input { width: 100%; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 1.1em; border-radius: 4px; cursor: pointer; flex: 1; transition: background 0.3s; }
        button:hover { background-color: #219150; }
        button.cancel-btn { background-color: #7f8c8d; }
        button.cancel-btn:hover { background-color: #95a5a6; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 600px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #34495e; color: white; font-size: 0.9em; }
        .detail-text { display: block; font-size: 0.75em; color: #666; margin-top: 4px; }
        .totals-row { font-weight: bold; background-color: #fdf2e9; }
        .money-row { font-weight: bold; background-color: #e8f8f5; color: #16a085; font-size: 1.2em; }
        .action-btns { display: flex; gap: 5px; justify-content: center; }
        .edit-btn { background-color: #2980b9; padding: 5px 10px; font-size: 0.8em; width: auto; }
        .edit-btn:hover { background-color: #3498db; }
        .delete-btn { background-color: #e74c3c; padding: 5px 10px; font-size: 0.8em; width: auto; }
        .delete-btn:hover { background-color: #c0392b; }
        .live-check { text-align: center; font-weight: bold; margin-bottom: 15px; padding: 8px; border-radius: 4px; background-color: #fadbd8; color: #c0392b; display: none; }
        .live-check.valid { background-color: #d4efdf; color: #27ae60; }
        
        .admin-lock-banner { background-color: #f1c40f; color: #2c3e50; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; margin-bottom: 20px; }
        .admin-lock-banner.unlocked { background-color: #2ecc71; color: white; }
        .admin-only { display: none; }
        .sync-status { text-align: right; font-size: 0.8em; color: #7f8c8d; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>麻雀収支計算アプリ</h1>
    <div class="sync-status" id="syncStatus">🔄 データベース接続中...</div>

    <div class="admin-lock-banner" id="lockBanner">
        🔒 閲覧モード（データの追加・変更はできません）
        <input type="password" id="inputPass" placeholder="パスワード" style="margin-left:10px; padding:3px; width:100px;">
        <button onclick="checkPassword()" style="padding:4px 10px; font-size:0.8em; width:auto; margin-left:5px; background-color:#34495e;">解除</button>
    </div>

    <h2>設定</h2>
    <div class="settings-grid">
        <div class="setting-item">
            <label>レート (1pt = X)</label>
            <input type="number" id="rate" value="30" oninput="onConfigChange()" class="lockable" disabled>
        </div>
        <div class="setting-item">
            <label>開始点 (例:250)</label>
            <input type="number" id="startScore" value="250" oninput="onConfigChangeWithFourth()" class="lockable" disabled>
        </div>
        <div class="setting-item">
            <label>チップ (1枚 = X pt)</label>
            <input type="number" step="0.1" id="chipRate" value="0.5" oninput="onConfigChange()" class="lockable" disabled>
        </div>
    </div>
    <div class="settings-grid">
        <div class="setting-item">
            <label>1着ウマ</label>
            <input type="number" id="uma1" value="20" oninput="onConfigChange()" class="lockable" disabled>
        </div>
        <div class="setting-item">
            <label>2着ウマ</label>
            <input type="number" id="uma2" value="10" oninput="onConfigChange()" class="lockable" disabled>
        </div>
        <div class="setting-item">
            <label>3着ウマ</label>
            <input type="number" id="uma3" value="-10" oninput="onConfigChange()" class="lockable" disabled>
        </div>
        <div class="setting-item">
            <label>4着ウマ</label>
            <input type="number" id="uma4" value="-20" oninput="onConfigChange()" class="lockable" disabled>
        </div>
    </div>

    <div class="admin-only" id="adminInputArea">
        <h2 id="inputTitle">半荘入力</h2>
        <div class="live-check" id="liveCheckStatus"></div>

        <div class="players-grid" id="inputSection">
            <div class="player-col">
                <label>プレイヤー1</label>
                <input type="text" id="name0" value="Aさん" oninput="onConfigChange()">
                <input type="number" id="score0" placeholder="素点" oninput="onScoreInput()">
                <input type="number" id="chip0" placeholder="チップ" oninput="checkTotalsLive()">
            </div>
            <div class="player-col">
                <label>プレイヤー2</label>
                <input type="text" id="name1" value="Bさん" oninput="onConfigChange()">
                <input type="number" id="score1" placeholder="素点" oninput="onScoreInput()">
                <input type="number" id="chip1" placeholder="チップ" oninput="checkTotalsLive()">
            </div>
            <div class="player-col">
                <label>プレイヤー3</label>
                <input type="text" id="name2" value="Cさん" oninput="onConfigChange()">
                <input type="number" id="score2" placeholder="素点" oninput="onScoreInput()">
                <input type="number" id="chip2" placeholder="チップ" oninput="checkTotalsLive()">
            </div>
            <div class="player-col">
                <label>プレイヤー4</label>
                <input type="text" id="name3" value="Dさん" oninput="onConfigChange()">
                <input type="number" id="score3" placeholder="4人目自動" oninput="checkTotalsLive()">
                <input type="number" id="chip3" placeholder="チップ" oninput="checkTotalsLive()">
            </div>
        </div>

        <div class="btn-group">
            <button id="submitBtn" onclick="addGame()">この半荘を記録する</button>
            <button id="cancelBtn" class="cancel-btn" onclick="cancelEdit()" style="display: none;">編集をキャンセル</button>
        </div>
    </div>

    <h2>成績表</h2>
    <div style="overflow-x: auto;">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>半荘</th>
                    <th id="th0">Aさん</th>
                    <th id="th1">Bさん</th>
                    <th id="th2">Cさん</th>
                    <th id="th3">Dさん</th>
                    <th class="admin-only">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
            <tfoot>
                <tr class="totals-row">
                    <td>合計(pt)</td>
                    <td id="totalPt0">0.0</td>
                    <td id="totalPt1">0.0</td>
                    <td id="totalPt2">0.0</td>
                    <td id="totalPt3">0.0</td>
                    <td class="admin-only">-</td>
                </tr>
                <tr class="money-row">
                    <td>最終収支</td>
                    <td id="money0">0</td>
                    <td id="money1">0</td>
                    <td id="money2">0</td>
                    <td id="money3">0</td>
                    <td class="admin-only">-</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    // ★★★ パスワードの設定（お好みのものに変更してください） ★★★
    const ADMIN_PASSWORD = "mjquato"; 

    // ★★★ 【重要】Firebaseの設定貼り付けエリア ★★★
    // ご自身のFirebaseコンソールで取得したオブジェクトに差し替えてください。
    const firebaseConfig = {
  apiKey: "AIzaSyA4QQW7h0jEuLvnEcWFzYRWWcvIuPZ1ucA",
  authDomain: "mj-app-60c9d.firebaseapp.com",
  projectId: "mj-app-60c9d",
  storageBucket: "mj-app-60c9d.firebasestorage.app",
  messagingSenderId: "297709702724",
  appId: "1:297709702724:web:78726aab3a3020bb2bb611"
};

    // Firebaseの初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let games = [];
    let editingIndex = -1;
    let isAdmin = false;
    let isInitialLoad = true;

    // クラウドデータベースからリアルタイムにデータを読み込む
    db.ref("mahjong_data").on("value", (snapshot) => {
        const data = snapshot.val();
        document.getElementById("syncStatus").innerText = "⚡ クラウド同期中";
        
        if (data) {
            // ゲームデータの同期
            games = data.games || [];
            
            // 設定・プレイヤー名の同期（閲覧者にも即座に反映させる）
            if (data.config) {
                document.getElementById('rate').value = data.config.rate || 30;
                document.getElementById('startScore').value = data.config.startScore || 250;
                document.getElementById('chipRate').value = data.config.chipRate || 0.5;
                document.getElementById('uma1').value = data.config.umas ? data.config.umas[0] : 20;
                document.getElementById('uma2').value = data.config.umas ? data.config.umas[1] : 10;
                document.getElementById('uma3').value = data.config.umas ? data.config.umas[2] : -10;
                document.getElementById('uma4').value = data.config.umas ? data.config.umas[3] : -20;
                
                if (data.config.names) {
                    for(let i=0; i<4; i++) {
                        document.getElementById(`name${i}`).value = data.config.names[i];
                        document.getElementById(`th${i}`).innerText = data.config.names[i];
                    }
                }
            }
            renderTable();
        }
        isInitialLoad = false;
    });

    // パスワードチェック
    function checkPassword() {
        const input = document.getElementById('inputPass').value;
        if (input === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById('lockBanner').className = "admin-lock-banner unlocked";
            document.getElementById('lockBanner').innerHTML = "🔓 管理者モード（編集がリアルタイム保存されます）";
            document.querySelectorAll('.lockable').forEach(el => el.disabled = false);
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            renderTable();
        } else {
            alert("パスワードが違います。");
        }
    }

    // 管理者がルールや名前を変更したときにデータベースへ保存する関数
    function saveConfigToFirebase() {
        if (!isAdmin || isInitialLoad) return;
        const config = {
            rate: parseFloat(document.getElementById('rate').value) || 0,
            startScore: parseFloat(document.getElementById('startScore').value) || 0,
            chipRate: parseFloat(document.getElementById('chipRate').value) || 0,
            umas: [
                parseFloat(document.getElementById('uma1').value) || 0,
                parseFloat(document.getElementById('uma2').value) || 0,
                parseFloat(document.getElementById('uma3').value) || 0,
                parseFloat(document.getElementById('uma4').value) || 0
            ],
            names: [
                document.getElementById('name0').value,
                document.getElementById('name1').value,
                document.getElementById('name2').value,
                document.getElementById('name3').value
            ]
        };
        db.ref("mahjong_data/config").set(config);
    }

    function onConfigChange() {
        saveConfigToFirebase();
        renderTable();
    }

    function onConfigChangeWithFourth() {
        autoCalcFourthPlayer();
        saveConfigToFirebase();
        renderTable();
    }

    function onScoreInput() {
        autoCalcFourthPlayer();
        checkTotalsLive();
    }

    function autoCalcFourthPlayer() {
        const startScore = parseFloat(document.getElementById('startScore').value) || 0;
        const targetTotal = startScore * 4;
        const s0 = document.getElementById('score0').value;
        const s1 = document.getElementById('score1').value;
        const s2 = document.getElementById('score2').value;

        if (s0 !== "" && s1 !== "" && s2 !== "") {
            const sum3 = parseFloat(s0) + parseFloat(s1) + parseFloat(s2);
            document.getElementById('score3').value = targetTotal - sum3;
        }
    }

    function checkTotalsLive() {
        const startScore = parseFloat(document.getElementById('startScore').value) || 0;
        const targetScoreTotal = startScore * 4;
        let totalScore = 0;
        let totalChip = 0;
        let hasEmpty = false;

        for (let i = 0; i < 4; i++) {
            let s = document.getElementById(`score${i}`).value;
            let c = document.getElementById(`chip${i}`).value;
            if (s === "" || c === "") hasEmpty = true;
            totalScore += parseFloat(s) || 0;
            totalChip += parseFloat(c) || 0;
        }

        const statusDiv = document.getElementById('liveCheckStatus');
        if (hasEmpty) {
            statusDiv.style.display = "none";
            return;
        }

        statusDiv.style.display = "block";
        if (totalScore === targetScoreTotal && totalChip === 0) {
            statusDiv.className = "live-check valid";
            statusDiv.innerText = `【チェックOK】素点合計: ${totalScore} / チップ合計: ${totalChip}`;
        } else {
            statusDiv.className = "live-check";
            statusDiv.innerText = `【不整合あり】素点合計: ${totalScore} (目標:${targetScoreTotal}) / チップ合計: ${totalChip} (目標:0)`;
        }
    }

    function addGame() {
        if (!isAdmin) return;

        const startScore = parseFloat(document.getElementById('startScore').value) || 0;
        const targetScoreTotal = startScore * 4;
        const chipRate = parseFloat(document.getElementById('chipRate').value) || 0;
        const umas = [
            parseFloat(document.getElementById('uma1').value) || 0,
            parseFloat(document.getElementById('uma2').value) || 0,
            parseFloat(document.getElementById('uma3').value) || 0,
            parseFloat(document.getElementById('uma4').value) || 0
        ];

        let players = [];
        let totalScore = 0;
        let totalChip = 0;
        let hasEmpty = false;

        for (let i = 0; i < 4; i++) {
            let scoreStr = document.getElementById(`score${i}`).value;
            let chipStr = document.getElementById(`chip${i}`).value;
            if (scoreStr === "" || chipStr === "") hasEmpty = true;
            let s = parseFloat(scoreStr) || 0;
            let c = parseFloat(chipStr) || 0;
            totalScore += s;
            totalChip += c;
            players.push({ index: i, score: s, chip: c, pt: 0, uma: 0 });
        }

        if (hasEmpty) {
            alert("素点とチップを全員分入力してください。");
            return;
        }

        if (totalScore !== targetScoreTotal || totalChip !== 0) {
            alert(`【入力エラー】合計値が正しくありません。`);
            return;
        }

        let sortedScores = players.map(p => p.score).sort((a, b) => b - a);
        players.forEach(p => {
            let rankIndices = [];
            sortedScores.forEach((score, idx) => {
                if (score === p.score) rankIndices.push(idx);
            });
            let sumUma = 0;
            rankIndices.forEach(idx => { sumUma += umas[idx]; });
            p.uma = sumUma / rankIndices.length;
            let basePt = (p.score - startScore) / 10;
            let chipPt = p.chip * chipRate;
            p.pt = basePt + p.uma + chipPt;
        });

        let gameRecord = {
            scores: players.map(p => p.score),
            chips: players.map(p => p.chip),
            umas: players.map(p => p.uma),
            pts: players.map(p => p.pt)
        };

        if (editingIndex === -1) {
            games.push(gameRecord);
        } else {
            games[editingIndex] = gameRecord;
            editingIndex = -1;
            document.getElementById('submitBtn').innerText = "この半荘を記録する";
            document.getElementById('cancelBtn').style.display = "none";
            document.getElementById('inputTitle').innerText = "半荘入力";
        }

        // Firebaseへ最新データをプッシュ
        db.ref("mahjong_data/games").set(games);
        saveConfigToFirebase();

        for (let i = 0; i < 4; i++) {
            document.getElementById(`score${i}`).value = '';
            document.getElementById(`chip${i}`).value = '';
        }
        document.getElementById('liveCheckStatus').style.display = "none";
    }

    function editGame(index) {
        if (!isAdmin) return;
        editingIndex = index;
        const game = games[index];
        for (let i = 0; i < 4; i++) {
            document.getElementById(`score${i}`).value = game.scores[i];
            document.getElementById(`chip${i}`).value = game.chips[i];
        }
        document.getElementById('inputTitle').innerText = `${index + 1}半荘目のデータを編集・修正中`;
        document.getElementById('submitBtn').innerText = "変更を適用して更新する";
        document.getElementById('cancelBtn').style.display = "inline-block";
        document.getElementById('inputTitle').scrollIntoView({ behavior: 'smooth' });
        checkTotalsLive();
    }

    function cancelEdit() {
        editingIndex = -1;
        document.getElementById('submitBtn').innerText = "この半荘を記録する";
        document.getElementById('cancelBtn').style.display = "none";
        document.getElementById('inputTitle').innerText = "半荘入力";
        for (let i = 0; i < 4; i++) {
            document.getElementById(`score${i}`).value = '';
            document.getElementById(`chip${i}`).value = '';
        }
        document.getElementById('liveCheckStatus').style.display = "none";
    }

    function deleteGame(index) {
        if (!isAdmin) return;
        if(confirm(`${index + 1}半荘目の記録を削除しますか？`)){
            if (editingIndex === index) cancelEdit();
            games.splice(index, 1);
            db.ref("mahjong_data/games").set(games);
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let totals = [0, 0, 0, 0];

        games.forEach((game, index) => {
            let tr = document.createElement('tr');
            let tdNum = document.createElement('td');
            tdNum.innerText = `${index + 1}半荘目`;
            tr.appendChild(tdNum);

            for (let i = 0; i < 4; i++) {
                let td = document.createElement('td');
                let pt = (Math.round(game.pts[i] * 10) / 10).toFixed(1);
                let ptText = pt > 0 ? `+${pt}` : pt;
                let cText = game.chips[i] > 0 ? `+${game.chips[i]}` : game.chips[i];
                let uFormatted = Number(game.umas[i].toFixed(2));
                let uText = uFormatted > 0 ? `+${uFormatted}` : uFormatted;

                td.innerHTML = `<strong>${ptText}pt</strong><span class="detail-text">(素点:${game.scores[i]} / チップ:${cText} / ウマ:${uText})</span>`;
                tr.appendChild(td);
                totals[i] += game.pts[i];
            }

            if (isAdmin) {
                let tdAction = document.createElement('td');
                tdAction.className = 'action-btns admin-only';
                tdAction.style.display = 'table-cell';

                let editBtn = document.createElement('button');
                editBtn.className = 'edit-btn';
                editBtn.innerText = '編集';
                editBtn.onclick = () => editGame(index);

                let delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerText = '削除';
                delBtn.onclick = () => deleteGame(index);

                tdAction.appendChild(editBtn);
                tdAction.appendChild(delBtn);
                tr.appendChild(tdAction);
            }

            tbody.appendChild(tr);
        });

        const rate = parseFloat(document.getElementById('rate').value) || 0;
        for (let i = 0; i < 4; i++) {
            let totalFixed = (Math.round(totals[i] * 10) / 10).toFixed(1);
            let ptCell = document.getElementById(`totalPt${i}`);
            ptCell.innerText = totalFixed > 0 ? `+${totalFixed}` : totalFixed;

            let truncated = Math.trunc(parseFloat(totalFixed));
            let finalMoney = truncated * rate;
            let moneyCell = document.getElementById(`money${i}`);
            moneyCell.innerText = finalMoney > 0 ? `+${finalMoney}` : finalMoney;
        }
    }
</script>

</body>
</html>
